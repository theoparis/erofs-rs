[package]
name = "erofs-sys"
version = "0.1.0"
edition = "2024"
authors = ["Yiyang Wu <toolmanp@tlmp.cc>"]
description = "Rust core implementation of the Extended Read Only FileSystem"
license = "MIT"
homepage = "https://github.com/ToolmanP/erofs-rs"
repository = "https://github.com/ToolmanP/erofs-rs"
readme = "README.md"
keywords = ["filesystem"]

[dependencies]

[dev-dependencies]
memmap2 = "0.9.10" # For Testing the Memory Backed Filesystem.
sha2 = "0.10.9" # For Inspecting the Hash of the filesystem data.
hex-literal = "1.1.0" # For Hexadecimal Literals

[lints]
workspace = true
